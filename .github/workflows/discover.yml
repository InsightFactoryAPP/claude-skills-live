name: discover
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run src/cli.ts discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          # See refresh.yml: a PR opened with GITHUB_TOKEN gets no CI run at
          # all, so validate would never run and the auto-merge below would
          # never fire.
          token: ${{ secrets.PAT_TOKEN }}
          branch: bot/discover
          branch-suffix: timestamp
          title: "feat: new candidate entries"
          body: |
            Candidates that cleared the inclusion bar (>=25 stars, not archived,
            not a mirror of proprietary source).

            Auto-merges when checks pass. Everything lands as `kind: skill` with
            empty tags; fix kind/tags/summaries in a follow-up if needed.
          commit-message: "feat: new candidate entries"
          labels: automated
      # Auto-merge only the PR this job just opened: a bot/discover-* branch
      # authored by the repo owner's PAT. Contributor PRs are never touched.
      - if: steps.cpr.outputs.pull-request-number != ''
        run: |
          read -r author head < <(gh pr view "$PR" --json author,headRefName --jq '"\(.author.login) \(.headRefName)"')
          if [[ "$author" != "${{ github.repository_owner }}" || "$head" != bot/discover-* ]]; then
            echo "refusing to auto-merge PR #$PR (author=$author head=$head)"; exit 0
          fi
          gh pr merge --squash --auto --delete-branch "$PR"
        env:
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
